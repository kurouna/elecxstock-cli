# v* のタグで、テストを通した Windows の単一実行ファイル（exe）を GitHub Releases に公開する
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version: 25
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Check the tag matches package.json
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Build the single executable
        shell: bash
        run: |
          npm run sea
          npm run fixture
          ./dist/elecxstock-cli.exe --version
          ./dist/elecxstock-cli.exe --where --data .fixture/data
      - name: Pack
        shell: pwsh
        run: |
          $name = "elecxstock-cli-$env:GITHUB_REF_NAME-win-x64"
          New-Item -ItemType Directory -Force "pack/$name" | Out-Null
          Copy-Item dist/elecxstock-cli.exe, dist/THIRD_PARTY_NOTICES.txt, LICENSE, README.md "pack/$name/"
          Compress-Archive -Path "pack/$name/*" -DestinationPath "pack/$name.zip"
          Copy-Item dist/elecxstock-cli.exe "pack/elecxstock-cli.exe"
          Get-FileHash "pack/$name.zip", "pack/elecxstock-cli.exe" -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content pack/SHA256SUMS.txt
          Get-Content pack/SHA256SUMS.txt
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" pack/*.zip pack/elecxstock-cli.exe pack/SHA256SUMS.txt \
            --title "elecxstock-cli $GITHUB_REF_NAME" --generate-notes --verify-tag
